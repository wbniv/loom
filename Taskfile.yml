version: '3'

includes:
  shared:
    taskfile: '{{.HOME}}/python-tui-lib/Taskfile.shared.yml'
    optional: true
    flatten: true

silent: true

tasks:
  prototype:test:
    desc: Run parser, identity, scope, declaration, reference, obligation, policy, binding-admission, extern, contract, evaluator, experiment-harness, mask, and store-admission tests
    dir: prototype
    cmds:
      - python3 -m unittest test_roundtrip test_scope test_references test_prelude test_matches test_effects test_fix_ref test_refinements test_obligations test_subsumption test_policies test_bindings test_externs test_corpus test_instantiation test_contracts test_interp test_experiment test_elicitation test_scale_arm test_legibility_arm test_masker test_store test_harvest test_harvest_select test_diversity_arms test_differential -v

  # ── L0, the differential harness (Track P prerequisite) ──────────────────
  # docs/plans/2026-08-14-production-language-decision.md, R7 / Track P. The
  # export is derived data and is gitignored: this task reproduces it byte for
  # byte from the tree, so the generator is what is version-controlled.

  differential:export:
    desc: "Write the L0 differential export (26 corpus fixtures, 5 examples, every rejection case the tests drive)"
    dir: prototype
    cmds:
      - python3 -m differential export {{.CLI_ARGS}}

  differential:fixtures:
    desc: "The fast slice of L0 — fixtures, declarations, obligations and policies only, no test-suite harvest"
    dir: prototype
    cmds:
      - python3 -m differential export --only fixtures {{.CLI_ARGS}}

  experiment:phase-a:
    desc: Run masked-generation experiment Phase A (conditions 1-3) from a config file
    dir: prototype
    cmds:
      - python3 -m experiment.runner --config "${LOOM_EXPERIMENT_CONFIG:-experiment/phase_a.config.json}" {{.CLI_ARGS}}

  # ── Batch-2 SML FFI generator spike (docs/investigations/2026-08-14-language-eval-batch-2.md) ──

  ffi-spike:
    desc: "Derive llama.cpp struct layouts from the real pinned llama.h; cross-check vs ctypes; compile+run against MLton if available"
    dir: tools/ffi-spike
    cmds:
      - ./run.sh {{.CLI_ARGS}}

  experiment:remote:
    desc: Run Phase A on a rented g6.xlarge in us-east-2 and bring runs/ back (~$1)
    deps: [setup]
    cmds:
      - bash scripts/run-remote-experiment.sh {{.CLI_ARGS}}

  experiment:remote:resume:
    desc: "Re-enter an AWS run whose driver died: fetch its results and tear the instance down (pass -- --resume-from prototype/runs/logs/driver-<tag>.json --fetch-only)"
    deps: [setup]
    cmds:
      - bash scripts/run-remote-experiment.sh {{.CLI_ARGS}}

  experiment:remote:test:
    desc: "Offline regression guard for the AWS remote driver's kill/resume path (no AWS, no network)"
    cmds:
      - bash scripts/tests/test-driver-resume-aws.sh

  experiment:remote-gcp:
    desc: Run Phase A on a rented g2-standard-4 (L4) in us-central1 and bring runs/ back (~$0.60)
    deps: [setup]
    cmds:
      - bash scripts/run-remote-experiment-gcp.sh {{.CLI_ARGS}}

  experiment:remote-gcp:resume:
    desc: "Re-enter a GCP run whose driver died: fetch every arm's results and tear the instance down (pass -- --resume-from prototype/runs/logs/driver-<tag>.json --fetch-only)"
    deps: [setup]
    cmds:
      - bash scripts/run-remote-experiment-gcp.sh {{.CLI_ARGS}}

  experiment:remote-gcp:test:
    desc: "Offline regression guard for the remote driver's kill/resume path (no GCP, no network)"
    cmds:
      - bash scripts/tests/test-driver-resume.sh

  infra:test-self-delete:
    desc: "Offline guard: the runner instance and its own startup script's INSTANCE_NAME cannot drift apart (mocked provider, no GCP)"
    cmds:
      - bash scripts/tests/test-runner-self-delete.sh

  infra:billing-export:
    desc: "Apply the billing-export root (BigQuery dataset + API enablement for GCP spend export; see docs)"
    cmds:
      - |
        set -euo pipefail
        TF="$HOME/.local/bin/terraform"
        [ -x "$TF" ] || TF="$(command -v terraform)"
        export GOOGLE_OAUTH_ACCESS_TOKEN="$(gcloud auth print-access-token)"
        "$TF" -chdir=infrastructure/gcp/billing-export init -input=false -reconfigure >/dev/null
        "$TF" -chdir=infrastructure/gcp/billing-export apply {{.CLI_ARGS}}

  gcp:spend:
    desc: "Query GCP spend from the BigQuery billing export (task gcp:spend -- --days 7, --month YYYY-MM, --by-sku)"
    cmds:
      - bash scripts/gcp-spend.sh {{.CLI_ARGS}}

  infra:destroy-diversity:
    desc: "Destroy the diversity-harvest root completely (safe: it shares no resource with any other run)"
    cmds:
      # A blanket destroy is only ever correct on a root that owns everything it
      # manages, which is precisely why experiment-diversity owns its own bucket
      # rather than borrowing the shared one. Nothing reachable from here belongs
      # to another run, so this cannot cost anybody else their results.
      - |
        set -euo pipefail
        TF="$HOME/.local/bin/terraform"
        [ -x "$TF" ] || TF="$(command -v terraform)"
        export GOOGLE_OAUTH_ACCESS_TOKEN="$(gcloud auth print-access-token)"
        "$TF" -chdir=infrastructure/gcp/experiment-diversity init -input=false -reconfigure >/dev/null
        "$TF" -chdir=infrastructure/gcp/experiment-diversity destroy -auto-approve \
          -var "run_id=teardown" -var "model_identity=teardown" -var "launch_runner=false"

  infra:fmt:
    desc: "terraform fmt -recursive over infrastructure/gcp (write mode; validate only checks)"
    cmds:
      - |
        set -euo pipefail
        TF="$HOME/.local/bin/terraform"
        [ -x "$TF" ] || TF="$(command -v terraform)"
        "$TF" fmt -recursive infrastructure/gcp

  infra:validate:
    desc: "terraform fmt + validate every GCP root, without a backend or any GCP call"
    cmds:
      # Each root is validated in a throwaway *copy*, not in place. Two reasons,
      # both learned the hard way on 2026-08-23: `init` in the real directory
      # rewrites .terraform/, which another run's driver may be using at that
      # moment; and a .terraform/ already cached there makes `-backend=false`
      # try to reach the backend anyway, so a validate would need credentials it
      # has no business needing. The copy has no .terraform/, so init is local,
      # no state is read, no lock is taken and no GCP call is made.
      - |
        set -euo pipefail
        TF="$HOME/.local/bin/terraform"
        [ -x "$TF" ] || TF="$(command -v terraform)"
        "$TF" fmt -check -recursive infrastructure/gcp
        scratch="$(mktemp -d)"
        trap 'rm -rf "$scratch"' EXIT
        cp -r infrastructure/gcp/modules "$scratch/modules"
        # Reuse the providers already on disk. `init` would otherwise reach
        # registry.terraform.io once per root, which makes a purely local check
        # depend on the network — and it has already failed here on a DNS
        # timeout. TF_PLUGIN_CACHE_DIR is seeded from whichever root has a
        # populated .terraform/providers; if none has, init falls back to the
        # registry and the check simply needs a connection that day.
        cache="$HOME/.terraform.d/plugin-cache"
        mkdir -p "$cache"
        for populated in infrastructure/gcp/*/.terraform/providers; do
          [ -d "$populated" ] || continue
          # -l hardlinks: a provider binary is ~700 MB and copying three of them
          # took longer than the check itself. -n never clobbers, so an already
          # cached version is left alone.
          cp -aln "$populated"/. "$cache"/ 2>/dev/null || true
        done
        export TF_PLUGIN_CACHE_DIR="$cache"
        for root in experiment experiment-pair experiment-diversity billing-export; do
          echo "── infrastructure/gcp/$root"
          mkdir -p "$scratch/$root"
          cp infrastructure/gcp/"$root"/*.tf "$scratch/$root/"
          cp infrastructure/gcp/"$root"/.terraform.lock.hcl "$scratch/$root/" 2>/dev/null || true
          "$TF" -chdir="$scratch/$root" init -backend=false -input=false >/dev/null
          "$TF" -chdir="$scratch/$root" validate
        done


  setup:
    desc: "Install pinned project tool dependencies (terraform, gcloud, rust) into ~/.local/bin and ~/.rustup; verify the rest. Idempotent."
    cmds:
      - |
        set -euo pipefail
        TF_VERSION=1.15.8
        BIN="$HOME/.local/bin"
        mkdir -p "$BIN"
        if "$BIN/terraform" version 2>/dev/null | grep -q "v${TF_VERSION}"; then
          echo "✓ terraform v${TF_VERSION} already installed at $BIN"
        else
          echo "Installing terraform v${TF_VERSION} → $BIN"
          TMP=$(mktemp -d)
          curl -fsSL -o "$TMP/tf.zip" "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
          unzip -o -q "$TMP/tf.zip" -d "$BIN" terraform
          rm -rf "$TMP"
          echo "✓ installed: $("$BIN/terraform" version | head -1)"
        fi
        if command -v gcloud >/dev/null 2>&1 || [ -x "$HOME/.local/google-cloud-sdk/bin/gcloud" ]; then
          echo "✓ gcloud already installed"
        else
          echo "Installing Google Cloud CLI → $HOME/.local/google-cloud-sdk"
          TMP=$(mktemp -d)
          curl -fsSL -o "$TMP/gcloud.tar.gz" "https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-linux-x86_64.tar.gz"
          tar -xzf "$TMP/gcloud.tar.gz" -C "$HOME/.local"
          rm -rf "$TMP"
          ln -sf "$HOME/.local/google-cloud-sdk/bin/gcloud" "$BIN/gcloud"
          ln -sf "$HOME/.local/google-cloud-sdk/bin/gsutil" "$BIN/gsutil"
          echo "✓ installed: $("$BIN/gcloud" version 2>/dev/null | head -1)"
        fi
        # bq ships in the same SDK tree but wasn't symlinked above; scripts/gcp-spend.sh
        # needs it. Idempotent and outside the if/else so an already-installed SDK
        # (the "already installed" branch above) still gets the symlink on a re-run.
        if [ -x "$HOME/.local/google-cloud-sdk/bin/bq" ]; then
          ln -sf "$HOME/.local/google-cloud-sdk/bin/bq" "$BIN/bq"
        fi
        # ── Rust (Track G: the store/ crate) ────────────────────────────────
        # Pinned exactly, not "stable": the store's own invariant is byte
        # identity, and a toolchain that moves under it is one more thing that
        # can change output without anyone asking. rustup lives in ~/.rustup,
        # cargo in ~/.cargo, both outside the repo.
        # store/rust-toolchain.toml is the authoritative pin; this only makes
        # sure the pinned toolchain exists, and never touches `rustup default`
        # (that is a machine-wide setting other projects may own).
        RUST_VERSION=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' store/rust-toolchain.toml)
        export RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo"
        if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
          echo "Installing rustup → $RUSTUP_HOME (toolchain ${RUST_VERSION})"
          TMP=$(mktemp -d)
          curl -fsSL --proto '=https' --tlsv1.2 -o "$TMP/rustup-init.sh" https://sh.rustup.rs
          sh "$TMP/rustup-init.sh" -y --no-modify-path --profile minimal \
            --default-toolchain "$RUST_VERSION" --component clippy --component rustfmt
          rm -rf "$TMP"
        elif "$CARGO_HOME/bin/rustup" toolchain list 2>/dev/null | grep -q "^${RUST_VERSION}-"; then
          echo "✓ rust ${RUST_VERSION} toolchain already installed"
        else
          echo "Installing pinned rust toolchain ${RUST_VERSION}"
          "$CARGO_HOME/bin/rustup" toolchain install "$RUST_VERSION" \
            --profile minimal --component clippy --component rustfmt
        fi
        echo "✓ $("$CARGO_HOME/bin/rustup" run "$RUST_VERSION" rustc --version)"
        echo "✓ $("$CARGO_HOME/bin/rustup" run "$RUST_VERSION" cargo --version)"

        for tool in aws python3 tar unzip curl git; do
          command -v "$tool" >/dev/null && echo "✓ $tool" || { echo "✗ missing: $tool — install it via your package manager"; exit 1; }
        done
        case ":$PATH:" in
          *":$HOME/.local/bin:"*) echo "✓ ~/.local/bin is on PATH" ;;
          *) echo "note: ~/.local/bin not on your shell PATH — project tasks handle this themselves, but add it to your rc for direct use" ;;
        esac

  aws-narrow:
    desc: "One-time, after aws-bootstrap: apply the self-narrowing IAM policy, verify it suffices, detach the broad policies."
    deps: [setup]
    cmds:
      - |
        set -euo pipefail
        export PATH="$HOME/.local/bin:$PATH"
        PROFILE=loom-terraform
        ACCOUNT=353144603271
        TFDIR=infrastructure/aws/iam-self
        SAFE="$HOME/python-tui-lib/scripts/tf-safe-apply.sh"

        echo "━━━ Phase C: scoped policy ━━━"
        "$SAFE" "$TFDIR" init
        "$SAFE" "$TFDIR" apply -auto-approve

        echo ""
        echo "━━━ Phase D: verify the scoped policy suffices ━━━"
        RESULT=$(AWS_PROFILE=$PROFILE aws iam simulate-principal-policy \
          --policy-source-arn arn:aws:iam::$ACCOUNT:user/loom-terraform \
          --action-names s3:CreateBucket s3:PutObject dynamodb:CreateTable \
            iam:CreateRole iam:PassRole ec2:RunInstances ec2:TerminateInstances \
            iam:CreateInstanceProfile sts:GetCallerIdentity \
          --query 'EvaluationResults[?EvalDecision!=`allowed`].[EvalActionName,EvalDecision]' \
          --output text || true)
        if [ -n "$RESULT" ]; then
          echo "✗ Scoped policy is missing permissions — NOT detaching broad policies:"
          echo "$RESULT"
          echo "Widen infrastructure/aws/iam-self/policy.tf and re-run task aws-narrow."
          exit 1
        fi
        echo "✓ All simulated actions allowed under the scoped policy."

        echo ""
        echo "━━━ Phase D: detach AdministratorAccess and ReadOnlyAccess ━━━"
        # Direct CLI detach: `terraform import` refuses addresses absent from
        # configuration (TF >= 1.5), so the old import-then-apply dance can
        # never detach. The scoped policy's IAMSelfManagement grants
        # iam:DetachUserPolicy on this user, so this works after Admin is gone.
        AWS_PROFILE=$PROFILE aws iam detach-user-policy --user-name loom-terraform \
          --policy-arn arn:aws:iam::aws:policy/ReadOnlyAccess 2>/dev/null || true
        AWS_PROFILE=$PROFILE aws iam detach-user-policy --user-name loom-terraform \
          --policy-arn arn:aws:iam::aws:policy/AdministratorAccess 2>/dev/null || true

        echo ""
        echo "━━━ End state ━━━"
        ATTACHED=$(AWS_PROFILE=$PROFILE aws iam list-attached-user-policies \
          --user-name loom-terraform --query 'AttachedPolicies[].PolicyName' --output text)
        echo "Attached: $ATTACHED"
        if [ "$ATTACHED" != "loom-terraform-scoped" ]; then
          echo "✗ Expected only loom-terraform-scoped to remain attached."
          exit 1
        fi
        echo "✓ Narrowed: only loom-terraform-scoped remains. Next: task experiment:remote"

  aws-bootstrap:
    desc: "One-time: create the loom-terraform IAM profile locally and bootstrap the S3/DynamoDB state backend."
    deps: [setup]
    cmds:
      - |
        set -euo pipefail
        export PATH="$HOME/.local/bin:$PATH"

        # Portable masked read: go-task's interpreter lacks bash's `read -n1`,
        # so hide echo with stty instead of star-masking per keystroke.
        read_masked() {
          printf "%s" "$1" >/dev/tty
          stty -echo </dev/tty
          IFS= read -r REPLY </dev/tty
          stty echo </dev/tty
          printf "\n" >/dev/tty
          printf "%s" "$REPLY"
        }

        PROFILE="loom-terraform"
        CREDS=~/.aws/credentials
        CONFIG=~/.aws/config
        STATE_BUCKET="loom-terraform-state-353144603271"

        if aws sts get-caller-identity --profile "$PROFILE" &>/dev/null; then
          echo "✓ AWS profile ${PROFILE} already configured — skipping key entry."
        else
          echo ""
          echo "━━━ Phase A: Create the IAM user (one manual step, ~3 min) ━━━"
          echo ""
          echo "1. Create the IAM user:"
          echo "   https://us-east-1.console.aws.amazon.com/iam/home#/users/create"
          echo "   Name: loom-terraform  |  No console access"
          echo ""
          echo "2. Attach policies on 'Set permissions' → 'Attach policies directly':"
          echo "   Filter by Type: AWS managed - job function"
          echo "   Search and check: AdministratorAccess"
          echo "   Search and check: ReadOnlyAccess"
          echo "   (both in same category — no filter switch needed)"
          echo "   Click 'Policies selected' tab to verify both are checked, then create."
          echo ""
          echo "3. Security credentials → Create access key → CLI → Description: loom-terraform-$(hostname)"
          echo ""
          printf "Paste Access Key ID:     " >/dev/tty
          read -r KEY_ID </dev/tty
          KEY_SECRET=$(read_masked "Paste Secret Access Key: ")

          # Rewrite-or-create the section: an earlier failed attempt may have
          # left a broken entry, so append-if-absent is not enough.
          python3 -c "import configparser,sys; p,k,sec=sys.argv[1:4]; cp=configparser.ConfigParser(); cp.read(p); cp.has_section('loom-terraform') or cp.add_section('loom-terraform'); cp.set('loom-terraform','aws_access_key_id',k); cp.set('loom-terraform','aws_secret_access_key',sec); f=open(p,'w'); cp.write(f); f.close()" "$CREDS" "$KEY_ID" "$KEY_SECRET"
          grep -q "^\[profile loom-terraform\]" "$CONFIG" 2>/dev/null \
            || printf "\n[profile loom-terraform]\nregion = us-east-2\noutput = json\n" >> "$CONFIG"
          echo "✓ Profile written."
        fi

        echo ""
        echo "Verifying profile…"
        aws sts get-caller-identity --profile "$PROFILE"

        if aws s3api head-bucket --bucket "$STATE_BUCKET" --profile "$PROFILE" &>/dev/null; then
          echo "✓ State backend already exists — skipping bootstrap Terraform."
        else
          echo ""
          echo "━━━ Phase B: Bootstrap Terraform state backend ━━━"
          "$HOME"/python-tui-lib/scripts/tf-safe-apply.sh infrastructure/aws/bootstrap init
          "$HOME"/python-tui-lib/scripts/tf-safe-apply.sh infrastructure/aws/bootstrap apply -auto-approve
          echo "✓ State bucket and lock table created."
        fi

        echo ""
        echo "━━━ AWS bootstrap complete. ━━━"
        echo ""
        echo "Activate cost allocation tags (once, after first tagged resource exists):"
        echo "  https://us-east-1.console.aws.amazon.com/billing/home#/tags"
        echo "  → Activate: Project, ManagedBy, Environment"

  # ── store/ (Track G: the first production Rust in the repo) ───────────────
  # Every Rust entry point goes through `cargo` from ~/.cargo, with the
  # toolchain pinned by store/rust-toolchain.toml. Nothing here assumes cargo
  # is on the caller's PATH, because `task setup` deliberately installs rustup
  # with --no-modify-path.

  store:build:
    desc: Build the loom-store binary (debug)
    dir: store
    env: &cargo_env
      CARGO_HOME: '{{.HOME}}/.cargo'
      RUSTUP_HOME: '{{.HOME}}/.rustup'
    cmds:
      - '{{.HOME}}/.cargo/bin/cargo build {{.CLI_ARGS}}'

  store:test:
    desc: Run the Rust unit and CLI-level test suites
    dir: store
    env: *cargo_env
    cmds:
      - '{{.HOME}}/.cargo/bin/cargo test {{.CLI_ARGS}}'

  store:lint:
    desc: clippy with warnings denied, plus rustfmt --check
    dir: store
    env: *cargo_env
    cmds:
      - '{{.HOME}}/.cargo/bin/cargo fmt --check'
      - '{{.HOME}}/.cargo/bin/cargo clippy --all-targets -- -D warnings'

  store:seed:
    desc: "Seed .loom-store with the pinned corpus (8 abilities, 4 data, 9 externs, 26 definitions), then fsck"
    deps: [store:build]
    env:
      LOOM_STORE: '{{.ROOT_DIR}}/.loom-store'
      LOOM_PROTOTYPE: '{{.ROOT_DIR}}/prototype'
    cmds:
      - store/target/debug/loom-store init --from-oracle
      - store/target/debug/loom-store admit --corpus
      - store/target/debug/loom-store fsck

  store:reseed:
    desc: "Delete and re-seed the store — the byte-identity check the plan's completion criteria name"
    deps: [store:build]
    cmds:
      - rm -rf '{{.ROOT_DIR}}/.loom-store'
      - task: store:seed

  store:fsck:
    desc: Re-prove every store invariant
    deps: [store:build]
    env:
      LOOM_STORE: '{{.ROOT_DIR}}/.loom-store'
    cmds:
      - store/target/debug/loom-store fsck

  store:export:
    desc: Write the resolver export the Python harness consumes
    deps: [store:build]
    env:
      LOOM_STORE: '{{.ROOT_DIR}}/.loom-store'
    cmds:
      - store/target/debug/loom-store export-resolver --out '{{.ROOT_DIR}}/.loom-store/export-resolver.json'

  # ── the corpus loop (docs/plans/2026-08-14-corpus-loop.md) ────────────────
  # A *second* store, deliberately. `.loom-store` is the pinned corpus seed the
  # resolver-equivalence tests read, and one of them asserts that its export is
  # exactly the oracle's corpus document — true of a seed, false of anything
  # harvested. `.loom-store-generated` is the loop's store: same corpus, plus a
  # run's accepted draws labelled `origin: generated`. Both follow-up arms read
  # this one and differ only by `include_generated`, which is the whole A/B.

  store:harvest:
    desc: "Seed .loom-store-generated with the corpus, then admit a run's accepted draws as origin=generated (RECORDS=path)"
    deps: [store:build]
    env:
      LOOM_STORE: '{{.ROOT_DIR}}/.loom-store-generated'
      LOOM_PROTOTYPE: '{{.ROOT_DIR}}/prototype'
    vars:
      RECORDS: '{{.RECORDS | default "prototype/runs/phase-b/records.jsonl"}}'
    cmds:
      - store/target/debug/loom-store init --from-oracle
      - store/target/debug/loom-store admit --corpus
      - python3 prototype/harvest.py --records '{{.RECORDS}}' --store '{{.ROOT_DIR}}/.loom-store-generated' --store-bin '{{.ROOT_DIR}}/store/target/debug/loom-store'
      - store/target/debug/loom-store fsck
      - store/target/debug/loom-store export-resolver --out '{{.ROOT_DIR}}/.loom-store-generated/export-resolver.json'

  store:harvest-dry:
    desc: "Recount a run's accepted draws through the admit path without touching a store (RECORDS=path)"
    vars:
      RECORDS: '{{.RECORDS | default "prototype/runs/phase-b/records.jsonl"}}'
      RESOLVER: '{{.RESOLVER | default "./.loom-store/export-resolver.json"}}'
    cmds:
      - python3 prototype/harvest.py --records '{{.RECORDS}}' --dry-run --resolver '{{.RESOLVER}}'

  # ── the diversity harvest (docs/plans/2026-08-23-diversity-harvest.md) ────
  # Two *more* stores, for the same reason there were two before: an arm is a
  # store, and the A/B is which objects are in it. `.loom-store-diverse` holds
  # the 15 definitions the distinct-shape gates admit from the pooled runs;
  # `.loom-store-sizematch` holds 15 drawn from the same pool by identity hash,
  # which is the control that keeps a null result interpretable. Both are built
  # from the recorded runs by scripts/build-store-variant.sh, which discovers
  # the pool rather than being handed it.

  store:diverse:
    desc: "Build .loom-store-diverse — corpus + the distinct-shape selection over every recorded run"
    deps: [store:build]
    vars:
      RUNS: '{{.RUNS | default "prototype/runs"}}'
    cmds:
      - bash scripts/build-store-variant.sh --store .loom-store-diverse --select distinct-shape --runs '{{.RUNS}}'

  store:sizematch:
    desc: "Build .loom-store-sizematch — the size-matched control arm (N=15 by identity hash)"
    deps: [store:build]
    vars:
      RUNS: '{{.RUNS | default "prototype/runs"}}'
      N: '{{.N | default "15"}}'
    cmds:
      - bash scripts/build-store-variant.sh --store .loom-store-sizematch --select 'size-match:{{.N}}' --runs '{{.RUNS}}'

  store:select-dry:
    desc: "Show what a selection policy would admit, touching no store (SELECT=distinct-shape)"
    vars:
      RUNS: '{{.RUNS | default "prototype/runs"}}'
      SELECT: '{{.SELECT | default "distinct-shape"}}'
    cmds:
      - bash scripts/build-store-variant.sh --store /dev/null --select '{{.SELECT}}' --runs '{{.RUNS}}' --dry-run

  experiment:diversity:
    desc: "Run one diversity-harvest arm (ARM=diverse_followup|sizematch_followup|diverse_heldout12|sizematch_heldout12)"
    dir: prototype
    cmds:
      - python3 -m experiment.runner --config 'experiment/{{.ARM | default "diverse_followup"}}.config.json' {{.CLI_ARGS}}

  experiment:followup:
    desc: "Run one arm of the corpus-loop follow-up (ARM=curated|generated); needs task store:harvest first"
    dir: prototype
    cmds:
      - python3 -m experiment.runner --config 'experiment/followup_{{.ARM | default "curated"}}.config.json' {{.CLI_ARGS}}

  experiment:mask-sanity:
    desc: Live sanity for Phase B's transport — loads a GGUF in process and walks the mask
    dir: prototype
    cmds:
      - python3 -m experiment.live_mask_sanity {{.CLI_ARGS}}

  grammar:test:
    desc: Validate the canonical Loom surface with llama.cpp's GBNF validator
    cmds:
      - python3 prototype/validate_gbnf.py "${LOOM_GBNF_VALIDATOR:-}"

  todo:lint:
    desc: Check TODO.md against the four-bucket + delegation-tier spec
    cmds:
      - python3 "$HOME"/python-tui-lib/scripts/todo-lint.py TODO.md

  todo:fix:
    desc: Apply the mechanical TODO.md fixes (never assigns a tier)
    cmds:
      - python3 "$HOME"/python-tui-lib/scripts/todo-lint.py --fix TODO.md

  todo:stale:
    desc: Surface open TODO items older than N days (N=30 by default)
    vars:
      DAYS: '{{.DAYS | default "30"}}'
    cmds:
      - python3 "$HOME"/python-tui-lib/scripts/old-todos.py --days {{.DAYS}} --project {{base .TASKFILE_DIR}}

  todo:init:
    desc: Scaffold TODO.md from the shared template (refuses to clobber)
    cmds:
      - bash "$HOME"/python-tui-lib/scripts/todo-init.sh .
